CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_HID=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n

CONFIG_USB_DEVICE_VID=0x239A
CONFIG_USB_DEVICE_PID=0x00B3
CONFIG_USB_DEVICE_MANUFACTURER="nice!nano"
CONFIG_USB_DEVICE_PRODUCT="Zephyr DualGyro+Touchpad Mouse"
CONFIG_USB_DEVICE_SN="NICENANO-DEV-01"
CONFIG_UART_LINE_CTRL=y

CONFIG_TPS43_TAPDRAG_ENABLE=y
CONFIG_TPS43_EDGESCROLL_ENABLE=y
CONFIG_I2C=y
CONFIG_SPI=y
