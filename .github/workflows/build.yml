name: Build Zephyr Firmware

on:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build gperf \
            ccache dfu-util device-tree-compiler \
            python3-dev python3-pip python3-setuptools \
            python3-wheel xz-utils file make \
            gcc gcc-multilib g++-multilib \
            libsdl2-dev libmagic1 wget unzip

      - name: Install Python deps
        run: pip3 install west pyelftools

      - name: Cache ARM GCC toolchain
        id: cache-arm-gcc
        uses: actions/cache@v4
        with:
          path: arm-gnu-toolchain-12.2.rel1-x86_64-arm-none-eabi
          key: arm-gcc-12.2

      - name: Install ARM GCC toolchain
        if: steps.cache-arm-gcc.outputs.cache-hit != 'true'
        run: |
          wget -q https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-arm-none-eabi.tar.xz
          tar xf arm-gnu-toolchain-12.2.rel1-x86_64-arm-none-eabi.tar.xz

      - name: Set up toolchain environment
        run: |
          echo "$(pwd)/arm-gnu-toolchain-12.2.rel1-x86_64-arm-none-eabi/bin" >> $GITHUB_PATH
          echo "ZEPHYR_TOOLCHAIN_VARIANT=gnuarmemb" >> $GITHUB_ENV
          echo "GNUARMEMB_TOOLCHAIN_PATH=$(pwd)/arm-gnu-toolchain-12.2.rel1-x86_64-arm-none-eabi" >> $GITHUB_ENV

      - name: Initialize & update west workspace
        working-directory: zephyr-app
        run: |
          west init -l .
          west update

      - name: Export Zephyr CMake package & install Python deps
        working-directory: zephyr-app
        run: |
          west zephyr-export
          pip3 install -r ../zephyr/scripts/requirements.txt

      - name: Build firmware
        working-directory: zephyr-app
        run: |
          west build -b nice_nano . -- \
            -DZEPHYR_EXTRA_MODULES=$PWD/module

      - name: Convert to UF2
        working-directory: zephyr-app
        run: |
          wget -q https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2conv.py
          python3 uf2conv.py build/zephyr/zephyr.hex -c -f 0xADA52840 -o build/zephyr/zephyr.uf2

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-uf2
          path: zephyr-app/build/zephyr/zephyr.uf2
